title = "Project Gitleaks Configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore lock files, vendored code, and binary assets"
paths = [
    '''gitleaks\.toml''',
    '''\.gitleaksignore''',

    # Lock files
    '''uv\.lock''',
    '''package-lock\.json''',
    '''pnpm-lock\.yaml''',
    '''yarn\.lock''',
    '''poetry\.lock''',
    '''Pipfile\.lock''',

    # Vendored / third-party
    '''vendor/''',
    '''node_modules/''',
    '''\.git/''',
    '''\.venv/''',

    # Binary / media assets
    '''(.*?)\.(jpg|jpeg|png|gif|svg|ico|bmp|tiff|webp)''',
    '''(.*?)\.(woff|woff2|ttf|eot|otf)''',
    '''(.*?)\.(pdf|docx|xlsx|pptx|zip|tar|gz|rar|7z)''',

    # Example / template files
    '''\.env\.example''',
    '''\.env\.sample''',
]

[[allowlists]]
description = "Ignore known placeholder / example values"
stopwords = [
    "example",
    "placeholder",
    "changeme",
    "your-",
    "insert-",
    "replace-",
    "EXAMPLE",
    "CHANGEME",
    "YOUR_",
    "dummy",
    "sample",
    "test-key",
    "fake-",
    "xxx",
]
