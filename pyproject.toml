[project]
name = "google-docs-mcp"
version = "0.1.0"
description = "MCP server for Google Docs — create, read, and write formatted documents with Markdown"
readme = "README.md"
authors = [
    { name = "Binny", email = "dhilipkumar7235@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "mistune>=3.0.0,<4.0.0",
]

[project.scripts]
google-docs-mcp = "google_docs_mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"
