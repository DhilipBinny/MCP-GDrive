[project]
name = "google-workspace-mcp"
version = "0.3.0"
description = "MCP servers for Google Workspace — Docs, Sheets, and Slides"
readme = "README.md"
authors = [
    { name = "Binny", email = "dhilipkumar7235@gmail.com" }
]
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["mcp", "google-docs", "google-sheets", "google-slides", "google-drive", "claude"]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "mistune>=3.0.0,<4.0.0",
    "platformdirs>=4.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
lint = ["ruff>=0.5.0", "mypy>=1.10"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
dev = ["google-workspace-mcp[lint,test]"]

[project.urls]
Homepage = "https://github.com/DhilipBinny/MCP-GDrive"
Repository = "https://github.com/DhilipBinny/MCP-GDrive"
Issues = "https://github.com/DhilipBinny/MCP-GDrive/issues"

[project.scripts]
google-docs-mcp = "google_docs_mcp.server:main"
google-sheets-mcp = "google_sheets_mcp.server:main"
google-slides-mcp = "google_slides_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared", "src/google_docs_mcp", "src/google_sheets_mcp", "src/google_slides_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
